name: Structural quality audit

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Python structural quality + docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve documentation comparison base
        id: docs_base
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            echo "sha=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then base="HEAD^"; fi
            echo "sha=$base" >> "$GITHUB_OUTPUT"
          fi
      - name: Run changed-file documentation and artifact hygiene
        run: python scripts/docs_hygiene.py --changed-since '${{ steps.docs_base.outputs.sha }}'
      - name: Run documentation hygiene regression tests
        run: python scripts/test_docs_hygiene.py
      - name: Select changed living Markdown
        id: docs_files
        shell: bash
        run: |
          set -euo pipefail
          python scripts/docs_hygiene.py --changed-since '${{ steps.docs_base.outputs.sha }}' --list-living-docs > "$RUNNER_TEMP/changed-living-docs.txt"
          if [[ -s "$RUNNER_TEMP/changed-living-docs.txt" ]]; then
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            echo 'any=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Markdown style (pinned markdownlint-cli2)
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t docs < "$RUNNER_TEMP/changed-living-docs.txt"
          npx --yes markdownlint-cli2@0.18.1 --config .markdownlint-cli2.yaml "${docs[@]}"
      - name: Install pinned lychee
        if: steps.docs_files.outputs.any == 'true'
        uses: lycheeverse/lychee-action@v2.4.1
        with:
          lycheeVersion: v0.20.1
          args: --version
          failIfEmpty: false
      - name: Prove lychee rejects a broken local link
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/research-notes-broken-link.md"
          printf '%s\n' '[broken](missing-local-target.md)' > "$fixture"
          if lychee --offline --no-progress --include-fragments --root-dir "$RUNNER_TEMP" "$fixture"; then
            echo 'lychee unexpectedly accepted a broken local link' >&2
            exit 1
          fi
      - name: Check actual relative links in changed living Markdown
        if: steps.docs_files.outputs.any == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t docs < "$RUNNER_TEMP/changed-living-docs.txt"
          lychee --offline --no-progress --include-fragments --root-dir "$GITHUB_WORKSPACE" "${docs[@]}"

      - name: Install audit tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.9" "lizard==1.24.0"

      - name: Audit current scripts
        shell: bash
        run: |
          set +e
          mkdir -p quality-audit
          ruff check scripts             --select C901,PLR0912,PLR0913,PLR0915             --config "lint.mccabe.max-complexity=15"             --config "lint.pylint.max-args=7"             --output-format concise > quality-audit/ruff.txt 2>&1
          lizard scripts -C 15 -L 75 -a 7 -w > quality-audit/lizard.txt 2>&1
          npx --yes jscpd@5.0.12 scripts             --min-lines 8 --min-tokens 60 --format python             --reporters console,json --output quality-audit/jscpd             > quality-audit/jscpd-console.txt 2>&1
          cat quality-audit/ruff.txt
          cat quality-audit/lizard.txt
          cat quality-audit/jscpd-console.txt
          exit 0

      - name: Enforce no structural regression
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          base_dir="$RUNNER_TEMP/quality-base-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          mkdir -p quality-audit/base
          (
            cd "$base_dir"
            set +e
            ruff check scripts               --select C901,PLR0912,PLR0913,PLR0915               --config "lint.mccabe.max-complexity=15"               --config "lint.pylint.max-args=7"               --output-format concise > "$GITHUB_WORKSPACE/quality-audit/base/ruff.txt" 2>&1
            lizard scripts -C 15 -L 75 -a 7 -w > "$GITHUB_WORKSPACE/quality-audit/base/lizard.txt" 2>&1
            npx --yes jscpd@5.0.12 scripts               --min-lines 8 --min-tokens 60 --format python --reporters console               > "$GITHUB_WORKSPACE/quality-audit/base/jscpd.txt" 2>&1
            true
          )
          count_ruff() { grep -Eo 'Found [0-9]+ errors?\.' "$1" | tail -1 | grep -Eo '[0-9]+' || echo 0; }
          count_lizard() { grep -c 'warning: .* NLOC,' "$1" || true; }
          count_clones() { grep -Eo 'Found [0-9]+ clones?\.' "$1" | tail -1 | grep -Eo '[0-9]+' || echo 0; }
          head_ruff="$(count_ruff quality-audit/ruff.txt)"; base_ruff="$(count_ruff quality-audit/base/ruff.txt)"
          head_lizard="$(count_lizard quality-audit/lizard.txt)"; base_lizard="$(count_lizard quality-audit/base/lizard.txt)"
          head_clones="$(count_clones quality-audit/jscpd-console.txt)"; base_clones="$(count_clones quality-audit/base/jscpd.txt)"
          {
            echo "### Research Notes quality ratchet"
            echo "| Signal | Base | Head |"
            echo "| --- | ---: | ---: |"
            echo "| Ruff structural findings | $base_ruff | $head_ruff |"
            echo "| Lizard structural findings | $base_lizard | $head_lizard |"
            echo "| jscpd clone blocks | $base_clones | $head_clones |"
          } >> "$GITHUB_STEP_SUMMARY"
          git worktree remove --force "$base_dir"
          test "$head_ruff" -le "$base_ruff" || { echo "::error::Ruff structural findings increased"; exit 1; }
          test "$head_lizard" -le "$base_lizard" || { echo "::error::Lizard structural findings increased"; exit 1; }
          test "$head_clones" -le "$base_clones" || { echo "::error::Clone blocks increased"; exit 1; }

      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structural-quality-audit-${{ github.sha }}
          path: quality-audit/
          if-no-files-found: warn
          retention-days: 7
