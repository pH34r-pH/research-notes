<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" role="img" aria-labelledby="title desc">
  <title id="title">Accessible signal and native utilization on the frozen branch task</title>
  <desc id="desc">An affine probe's evaluation log-loss gain was 0.737664 nat, with a one-sided lower confidence bound about 0.678 nat. The frozen native consumer's gain was 0.006446 nat. Both are measured against the constant baseline; this is a bounded natural-source branch task, not next-byte prediction.</desc>
  <rect width="920" height="300" fill="#f4f0e8" />
  <text x="34" y="42" font-family="system-ui,sans-serif" font-size="18" font-weight="700" fill="#252720">Evaluation log-loss gain over constant baseline</text>
  <text x="34" y="78" font-family="system-ui,sans-serif" font-size="14" fill="#62645d">Frozen natural-source branch benchmark · nat</text>
  <line x1="300" y1="104" x2="300" y2="235" stroke="#77786f" stroke-width="1" />
  <line x1="510" y1="104" x2="510" y2="235" stroke="#c5c1b7" stroke-width="1" />
  <line x1="720" y1="104" x2="720" y2="235" stroke="#c5c1b7" stroke-width="1" />
  <text x="34" y="145" font-family="system-ui,sans-serif" font-size="16" fill="#252720">Affine-softmax probe</text>
  <rect x="300" y="122" width="387.3" height="34" rx="3" fill="#3b82a0" />
  <text x="700" y="145" font-family="ui-monospace,monospace" font-size="14" fill="#252720">0.737664</text>
  <text x="34" y="205" font-family="system-ui,sans-serif" font-size="16" fill="#252720">Frozen native consumer</text>
  <rect x="300" y="182" width="3.4" height="34" rx="1" fill="#b04b34" />
  <text x="314" y="205" font-family="ui-monospace,monospace" font-size="14" fill="#252720">0.006446</text>
  <text x="292" y="255" font-family="system-ui,sans-serif" font-size="12" fill="#62645d">0</text>
  <text x="502" y="255" font-family="system-ui,sans-serif" font-size="12" fill="#62645d">0.4</text>
  <text x="712" y="255" font-family="system-ui,sans-serif" font-size="12" fill="#62645d">0.8</text>
  <text x="34" y="282" font-family="system-ui,sans-serif" font-size="12" fill="#62645d">Probe one-sided lower confidence bound: about 0.678 nat. Values summarize this bounded task only.</text>
</svg>
